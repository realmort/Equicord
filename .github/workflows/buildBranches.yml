name: Build Branches

on:
    push:
        branches:
            - "**"
    workflow_dispatch:
        inputs:
            branch:
                type: choice
                description: "Branch to build and upload"
                options:
                    - main
                    - dev
                    - translation
                default: "dev"

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
    REPO: realmort/Equicord-devbuild
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build Equicord
        runs-on: ubuntu-latest
        if: github.repository == 'realmort/Equicord'

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.branch || github.ref }}

            - uses: pnpm/action-setup@v3
              if: github.ref_name != 'bun'

            - name: Use Node.js 24
              if: github.ref_name != 'bun'
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              if: github.ref_name != 'bun'
              run: pnpm install --frozen-lockfile

            - name: Build web
              if: github.ref_name != 'bun'
              run: pnpm buildWebStandalone

            - name: Build
              if: github.ref_name != 'bun'
              run: pnpm buildStandalone

            - name: Generate plugin lists
              if: github.ref_name != 'bun'
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - uses: oven-sh/setup-bun@v2
              if: github.ref_name == 'bun'
              with:
                  bun-version: latest

            - name: Install dependencies
              if: github.ref_name == 'bun'
              run: bun install

            - name: Build web
              if: github.ref_name == 'bun'
              run: bun run buildWebStandalone

            - name: Build
              if: github.ref_name == 'bun'
              run: bun run buildStandalone

            - name: Generate plugin lists
              if: github.ref_name == 'bun'
              run: |
                  bun run generatePluginJson dist/plugins.json
                  bun run generateEquicordPluginJson dist/equicordplugins.json
                  bun run generateVencordPluginJson dist/vencordplugins.json
                  bun run generateDevsList dist/devs.json

            - name: Create Release in Equicord-devbuild
              run: |
                  BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
                  COMMIT_SHA=$(git rev-parse --short HEAD)
                  gh release delete "$BRANCH" --yes --repo realmort/Equicord-devbuild 2>/dev/null || true
                  gh release create "$BRANCH" \
                    --title "$BRANCH" \
                    --notes "Builds for https://github.com/$GITHUB_REPOSITORY/commit/$COMMIT_SHA" \
                    --repo realmort/Equicord-devbuild \
                    dist/browser/browser.css \
                    dist/browser/browser.js \
                    dist/browser/browser.js.LEGAL.txt \
                    dist/desktop.asar \
                    dist/equibop.asar \
                    dist/devs.json \
                    dist/equibop/main.js \
                    dist/equibop/main.js.LEGAL.txt \
                    dist/equibop/preload.js \
                    dist/equibop/renderer.css \
                    dist/equibop/renderer.js \
                    dist/equibop/renderer.js.LEGAL.txt \
                    dist/Equicord.user.js \
                    dist/Equicord.user.js.LEGAL.txt \
                    dist/equicordplugins.json \
                    dist/extension-chrome.zip \
                    dist/extension-firefox.zip \
                    dist/desktop/patcher.js \
                    dist/desktop/patcher.js.LEGAL.txt \
                    dist/plugins.json \
                    dist/desktop/preload.js \
                    dist/desktop/renderer.css \
                    dist/desktop/renderer.js \
                    dist/desktop/renderer.js.LEGAL.txt \
                    dist/vencordplugins.json
              env:
                  GH_TOKEN: ${{ secrets.PAT_TOKEN }}
