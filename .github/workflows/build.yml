name: Release
on:
    push:
        branches:
            - main
env:
    FORCE_COLOR: true
    REPO: realmort/Equibored
    USERNAME: GitHub-Actions
permissions:
    contents: write
jobs:
    Build:
        name: Build Equicord
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build web
              run: pnpm buildWebStandalone
            - name: Build
              run: pnpm buildStandalone
            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json
            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release
                  cp browser/browser.* release
                  cp Equicord.user.{js,js.LEGAL.txt} release
                  cp *.{json,zip,asar} release
                  cp desktop/* release
                  for file in equibop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done
                  find release -size 0 -delete
                  rm release/package.json
                  rm release/*.map
            - name: Upload Equicord Stable
              if: ${{ vars.ACT == 'false' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git_hash=$(git rev-parse --short HEAD)
                  gh release delete latest --yes 2>/dev/null || true
                  gh release create latest --title "Equicord $git_hash" --notes "" dist/release/*
            - name: Upload Plugin JSONs to Equibored repo
              if: github.repository == 'realmort/Equicord' && vars.ACT == 'false'
              run: |
                  git config --global user.name "GitHub-Actions"
                  git config --global user.email actions@github.com
                  git clone https://$USERNAME:${{ secrets.ETOKEN }}@github.com/$REPO.git plugins
                  cd plugins
                  cp ../dist/release/*plugins.json .
                  cp ../dist/release/devs.json .
                  git add -A
                  git commit -m "Plugins for https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
                  git push --force https://$USERNAME:${{ secrets.ETOKEN }}@github.com/$REPO.git
